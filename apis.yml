aid: c-side
name: c/side
description: >-
  c/side (cside) is a client-side security platform that detects script attacks,
  AI agents, account takeover, and fraud at the browser layer. It provides active
  runtime detection that watches what third-party scripts, users, and agents
  actually do as they execute in the live browser session, in real time, rather
  than relying on static scans or block-lists, and it automates PCI DSS 4.0.1
  requirements 6.4.3 and 11.6.1 (validated by a VikingCloud QSA). cside deploys as
  a single JavaScript snippet with no proxy and no DNS changes, and was the first
  client-side security product with integrated AI analysis. The platform protects
  websites from malicious third-party scripts, e-skimming, Magecart, and supply
  chain attacks, and adds device fingerprinting (102+ signals), VPN/bot/AI-agent
  detection, chargeback evidence, and privacy monitoring for GDPR, CCPA, and HIPAA.
  Founded in 2024 and backed by Uncork Capital, cside integrates via a CLI, Next.js
  and Vite plugins, a manual script tag, and Salesforce Lightning, and sends
  security alerts through webhook, S3, and Jira/Linear notification endpoints. cside
  publishes an llms.txt, a public read-only MCP server, and a Trust Center covering
  SOC 2 Type II, PCI SAQ-D, and ISO 27001.
