generated: '2026-07-18'
method: searched
status: published
source: https://cside.com/llms.txt
description: >-
  cside operates a public, read-only remote MCP (Model Context Protocol) server at
  https://mcp.cside.com that exposes cside.com marketing-site and docs.cside.com
  documentation content (not the cside product API). No authentication is required.
  Tool list captured verbatim from a live tools/list call on 2026-07-18. Add the
  URL to Claude Desktop / Cursor / ChatGPT or any MCP client.
server:
  name: cside
  transport: http
  url: https://mcp.cside.com
  auth: none
  access: read-only
tools:
  - name: search
    description: >-
      Full-text search across cside.com marketing-site pages (blog, comparisons,
      solutions, glossary) and docs.cside.com documentation. Read-only, public
      content. Returns top matches with URL, title, type, locale, and a context
      snippet. Filters: type (blog|compare|solution|use_case|industry|glossary|article|docs|page),
      locale (en|es|fr|nl|pt), limit (1-50).
  - name: get
    description: >-
      Fetch the full markdown body of one cside.com or docs.cside.com page by
      canonical URL or cside:// resource URI.
  - name: list
    description: >-
      List all content entries of a given type (e.g. every competitor comparison,
      every solution), optionally filtered by locale.
